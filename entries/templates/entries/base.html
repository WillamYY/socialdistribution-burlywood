{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Social Distribution Node{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
    <link rel="stylesheet" href="{% static 'entries/styles.css' %}">
    {% block style %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <a href="{% url 'NodeDisplay' %}">Home</a>
        <a href="{% url 'stream' %}">Stream</a>
        <a href="{% url 'view_my_entries' %}">My Entries</a>
        <a href="{% url 'create_entry' %}">Create Entry</a>
        {% if request.session.author_id %}
            <a href="/app/profile/">My Profile</a>
            <a href="/app/follow-requests/">Follow Requests</a>
            <a href="/app/logout/">Logout</a>
        {% else %}
            <a href="/app/login/">Login</a>
            <a href="/app/signup/">Sign Up</a>
        {% endif %}
    </nav>

    <main class="content-container">
        {% block content %}
        {% endblock %}
    </main>
    
    <script src="{% static 'entries/js/main.js' %}"></script>
</body>
</html>

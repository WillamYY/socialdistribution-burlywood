{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Social Distribution Node{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'entries/styles.css' %}">
    {% block style %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header.header h1 {
            position: sticky;
            top: 0;
        }
    </style>
    {% endblock %}
</head>
<body>
    <header class="header">
        <h1>
            Social Distribution Project
        </h1>
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="{% url 'NodeDisplay' %}">Home</a>
                </li>
                <li>
                    <a href="{% url 'stream' %}">Stream</a>
                </li>
                <li>
                    <a href="{% url 'view_my_entries' %}">My Entries</a>
                </li>
                <li>
                    <a href="{% url 'create_entry' %}">Create Entry</a>
                </li>
                <li>
                    <a href="{% url 'ProfileView' %}">Profile</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="content-container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>

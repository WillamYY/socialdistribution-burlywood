{% extends 'entries/base.html' %}

{% block body_extra_class %}shell-wide{% endblock %}

{% block title %}New post{% endblock %}

{% block content %}
<div class="page-container">
    <header class="page-hero">
        <h1 class="page-hero__title">New entry</h1>
        <p class="page-hero__sub">Share text, markdown, or an image with your network.</p>
    </header>
    <div class="card form-card">
        <form method="POST" enctype="multipart/form-data" class="form-container">
            {% include 'entries/entry_form.html' %}
            <div class="form-footer">
                <div class="footer-save-cancel-actions">
                    <button type="submit" class="btn-save">Post Entry</button>
                    <a href="{% url 'view_my_entries' %}" class="btn-cancel">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'entries/base.html' %}

{% block title %}Edit Entry{% endblock %}

{% block content %}
<div class="page-container">
    <header class="page-hero">
        <h1 class="page-hero__title">Edit entry</h1>
        <p class="page-hero__sub">Update visibility, content, or formatting.</p>
    </header>

    <div class="card form-card">
        <h2 style="margin-top:0;font-size:1.25rem;">Changes</h2>
        <form method="POST" enctype="multipart/form-data" class="form-container">
            {% include 'entries/entry_form.html' %}
            <div class="form-footer">
                <div class="footer-save-cancel-actions">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <a href="{% url 'view_my_entries' %}" class="btn-cancel">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

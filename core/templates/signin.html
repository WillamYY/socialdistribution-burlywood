<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
    </head>
    <body>
        <h1>Sign in to node</h1>
        <!-- Sends a post request with the info to the process signup of the specific node-->
        <form method = "POST" action = "/app/process-signin/">
            Username <input name = "username">
            Password <input name = "password">
            <input type = "submit">
            {% csrf_token %}
        </form>
        <p>{{errormessage}}</p> 
    </body>
</html>

{% extends 'entries/base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="page page--narrow">
  <div class="card auth-card">
    <h2 style="margin-top:0;text-align:center;">Welcome back</h2>
    <p class="muted text-center" style="margin-bottom:20px;">Sign in to post, follow, and comment.</p>
    {% if error %}
      <p class="error text-center">{{ error }}</p>
    {% endif %}
    <form method="POST" class="form-stack">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">

      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" required autocomplete="username">

      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" required autocomplete="current-password">

      <input type="submit" value="Log in">
    </form>
    <p class="muted text-center" style="margin-top:16px;">
      <a href="/app/signup">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}

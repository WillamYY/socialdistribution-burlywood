{% extends 'entries/base.html' %}
{% load static %}

{% block title %}Sign up{% endblock %}

{% block content %}
<div class="page page--narrow">
    <div class="card auth-card">
        <h2 style="margin-top:0;text-align:center;">Create an account</h2>
        <p class="muted text-center" style="margin-bottom:20px;">Join this node as an author.</p>
        {% if message %}
            <div class="error text-center" style="margin-bottom:12px;">{{ message }}</div>
        {% endif %}
        <form method="POST" action="/app/process-signup/" class="form-stack form-stack--signup">
            {% csrf_token %}
            <label for="id_account_type">Account type</label>
            <select id="id_account_type" name="account_type">
                <option value="author">Author</option>
            </select>

            <label for="id_username">Username</label>
            <input id="id_username" name="username" type="text" required minlength="3" maxlength="40"
                   placeholder="Letters, numbers, underscores, hyphens (3–40)" autocomplete="username">

            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" required minlength="8"
                   placeholder="At least 8 characters" autocomplete="new-password">

            <input type="submit" value="Sign up">
        </form>
        <p class="muted text-center" style="margin-top:16px;">
            <a href="/app/login">Already have an account? Log in</a>
        </p>
    </div>
</div>
{% endblock %}

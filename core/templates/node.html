<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authors Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .container {
      margin: 40px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 600px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 12px 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    a {
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>All Authors on This Node</h1>
    <ul>
      {% for user in users %}
        <li>
          <a href="{% url 'ProfileDisplay' user.id %}">
            {{ user.username }}
          </a>
        </li>
      {% empty %}
        <li>No authors found.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
